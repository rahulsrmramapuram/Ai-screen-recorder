{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 60px auto;">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 class="page-title">Welcome Back</h1>
      <p class="page-subtitle">Log in to your Solar account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register now</a>
    </div>
  </div>
</div>
{% endblock %}
